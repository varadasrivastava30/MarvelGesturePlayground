function drawDust(dt){D.t+=dt;ctx.drawImage(D.bg,0,0);ctx.drawImage(D.person,0,0);const pc=D.person.getContext('2d');let left=0;
 pc.globalCompositeOperation='destination-out';pc.beginPath();
 for(const b of D.blocks){if(b.g)continue;if(b.d<=D.t){b.g=1;pc.rect(b.x,b.y,6,6);D.dust.push({x:b.x+R(0,6),y:b.y+R(0,6),vx:R(30,170),vy:R(-120,-20),t:R(2,4.5),q:b.q})}else left++}
 pc.fill();pc.globalCompositeOperation='source-over';const bk=D.bk;bk.forEach(a=>a.length=0);
 for(let i=D.dust.length-1;i>=0;i--){const p=D.dust[i];p.t-=dt;if(p.t<=0){D.dust[i]=D.dust[D.dust.length-1];D.dust.pop();continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=R(-1,1)*220*dt;bk[p.q].push(p)}
 bk.forEach((a,q)=>{if(!a.length)return;ctx.fillStyle=D.pal[q];ctx.beginPath();for(const p of a){const z=1.5+2*Math.min(1,p.t);ctx.rect(p.x,p.y,z,z)}ctx.fill()});
 if(!left&&!D.dust.length)phase='fade'}

// ---- main loop ----------------------------------------------------------------
function frame(){requestAnimationFrame(frame);const t=now(),dt=Math.min(.05,t-last||.016);last=t;
 const live=()=>{ctx.save();ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(vid,0,0,W,H);ctx.restore()};
 let txt=['Draw a circle with 2 fingers → sling ring','Show the full back of your hand → gauntlet; close fist / snap → dust after 2 s','Open palm → repulsor blast','Spider-Man sign (index + pinky up, middle + ring folded) → webs','Keys: B plate · R reset · D debug · F flip palm/back · S snap'];
 if(phase==='dust'){drawDust(dt);return}
 live();if(phase==='fade'){D.f+=dt;ctx.globalAlpha=Math.max(0,1-D.f/2);ctx.drawImage(D.bg,0,0);ctx.globalAlpha=1;if(D.f>2){phase='live';D=null}}
 (phase==='live'||phase==='wait'?res:[]).forEach((r,i)=>{const s=st[i]=st[i]||{trail:[],blast:-9,palmT:0,backT:-9,pin:false,pinT:0};const h=analyze(r.lm,r.label,s.h);s.h=h;s.seen=t;
  if(h.pose==='portal'){const tip=h.two?{x:(h.P[8].x+h.P[12].x)/2,y:(h.P[8].y+h.P[12].y)/2}:h.P[8];s.trail.push({x:tip.x,y:tip.y,t});
   if(Math.random()<.9)spark(tip.x,tip.y,R(-90,90),R(-90,90),R(.3,.7),'#ffb52e')}else s.trail.length=0;
  while(s.trail.length&&t-s.trail[0].t>1.8)s.trail.shift();
  if(s.trail.length>1){ctx.save();ctx.globalCompositeOperation='lighter';ctx.shadowColor='#ff9a1f';ctx.shadowBlur=18;ctx.lineWidth=5;ctx.lineCap='round';ctx.strokeStyle='rgba(255,190,70,.9)';
   ctx.beginPath();s.trail.forEach((p,k)=>k?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.restore();
   const c=arcFit(s.trail);if(c){if(c.sw>=TAU*.8){portals.push({x:c.x,y:c.y,r:c.r,t0:t,life:5.5});s.trail.length=0;for(let k=0;k<80;k++){const a=R(0,TAU);spark(c.x+Math.cos(a)*c.r,c.y+Math.sin(a)*c.r,Math.cos(a)*R(100,500),Math.sin(a)*R(100,500),R(.4,1),'#ffd36b')}}
   else if(c.sw>.9){ctx.save();ctx.globalCompositeOperation='lighter';ctx.shadowColor='#ff9a1f';ctx.shadowBlur=14;ctx.strokeStyle='rgba(255,190,70,.55)';ctx.lineWidth=c.r*.07;ctx.lineCap='round';
    ctx.beginPath();ctx.arc(c.x,c.y,c.r,c.a0,c.a0+c.dir*c.sw,c.dir<0);ctx.stroke();ctx.restore();
    for(let k=0;k<12;k++){const a=c.a0+c.dir*c.sw*Math.random(),w=1.2*c.r*c.dir;spark(c.x+Math.cos(a)*c.r,c.y+Math.sin(a)*c.r,-Math.sin(a)*w+R(-60,60)+Math.cos(a)*R(0,120),Math.cos(a)*w+R(-60,60)+Math.sin(a)*R(0,120),R(.3,.8),Math.random()<.3?'#fff2b0':'#ffae2b')}}}}
  if(h.pose==='palm'){if(!s.wasPalm)s.palmT=t;iron(h,s,t)}s.wasPalm=h.pose==='palm';if(h.pose==='spider'){if(!s.spT)s.spT=t;if(t-s.spT>.12&&t-(s.lastWeb||-9)>.55){s.lastWeb=t;shootWeb(h)}}else s.spT=0;
  if(!h.palm)s.backT=t;
  if(!h.palm&&h.open&&h.pose==='back'){if(!s.fullT)s.fullT=t}else if(h.palm||h.pose==='spider'||h.pose==='portal'){s.fullT=0;s.gOn=false}
  if(s.fullT&&t-s.fullT>.35)s.gOn=true;
  if(s.gOn&&!h.palm)gauntlet(h,s,t);
  const closing=!h.palm&&(h.curl<.95||(h.pinch<.3&&dist(h.P[4],h.P[8])/h.size>.3));
  if(s.gOn&&closing){if(!s.trg)s.trg=t;s.trgL=t}else if(t-(s.trgL||-9)>.5)s.trg=0;
  if(s.trg){const rem=2-(t-s.trg);txt.push('SNAP – dust in '+Math.max(0,rem).toFixed(1)+'s');if(rem<=0){s.trg=0;snap(h,s,t);s.gOn=false;s.fullT=0}}
  if(debug){ctx.fillStyle='#0f0';h.P.forEach(p=>ctx.fillRect(p.x-3,p.y-3,6,6))}
  txt.push(`hand ${i}: ${h.pose}${h.two?' (2 fingers)':''}  pinch ${h.pinch.toFixed(2)}  ${h.userRight?'R':'L'}`)});
 st.forEach((s,i)=>{if(i>=res.length){s.pin=false;s.rel=0;if(t-s.seen>.6){s.gOn=false;s.fullT=0;s.trg=0}}if(i>=res.length)s.h=null});  // snap so fast the hand tracking lost it
 for(let i=portals.length-1;i>=0;i--)if(!drawPortal(portals[i],dt))portals.splice(i,1);
 drawWebs(t);drawParts(dt);
 if(flash>0){ctx.fillStyle=`rgba(255,220,150,${flash*.8})`;ctx.fillRect(0,0,W,H);flash-=dt*1.5}
 $('hud').textContent=txt.join('\n')}

async function start(){$('start').remove();
 const s=await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720,facingMode:'user'}});vid.srcObject=s;await vid.play();
 W=cv.width=vid.videoWidth;H=cv.height=vid.videoHeight;sI=await load(IMG.S);wI=await load(IMG.W);
 hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`});
 hands.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:.6,minTrackingConfidence:.5});
 hands.onResults(r=>{res=(r.multiHandLandmarks||[]).map((lm,i)=>({lm,label:r.multiHandedness[i].label}))});
 seg=new SelfieSegmentation({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/${f}`});
 seg.setOptions({modelSelection:1});seg.onResults(r=>segCb&&segCb(r.segmentationMask));
 await seg.send({image:vid});const pump=async()=>{if(phase==='live')await hands.send({image:vid});requestAnimationFrame(pump)};pump();frame()}
$('go').onclick=()=>start().catch(e=>alert('Camera/model error: '+e.message+'\nIf opened from a file, try: python3 -m http.server and open http://localhost:8000'));
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
 if(k==='b'){plate=mk();const g=plate.getContext('2d');g.translate(W,0);g.scale(-1,1);g.drawImage(vid,0,0,W,H)}
 if(k==='r'){phase='live';D=null;portals.length=0}if(k==='d')debug=!debug;if(k==='f')flip=!flip;if(k==='s'){const s0=st[0];snap(s0&&s0.h,s0,now())}});
</script></body></html>
